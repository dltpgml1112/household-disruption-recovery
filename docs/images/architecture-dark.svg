<svg xmlns="http://www.w3.org/2000/svg" width="880" height="832" viewBox="0 0 880 832" role="img" aria-label="System architecture. The web simulator sends each utterance to the orchestrator (FastAPI, /api), which runs the Strands agent with Gemini, a rule agent as fallback, and a consent check. The model gets 7 of the 8 MCP tools; approve_recovery_plan is called only by the orchestrator after the consent check passes. Every tool call goes over HTTP to the MCP server (/mcp, spec 2025-11-25, Streamable HTTP). The recovery service behind the tools issues approval tokens, handles idempotency keys and writes an audit row per call; the planner and checker are pure functions; only the recovery service writes to SQLite."><title>System architecture. The web simulator sends each utterance to the orchestrator (FastAPI, /api), which runs the Strands agent with Gemini, a rule agent as fallback, and a consent check. The model gets 7 of the 8 MCP tools; approve_recovery_plan is called only by the orchestrator after the consent check passes. Every tool call goes over HTTP to the MCP server (/mcp, spec 2025-11-25, Streamable HTTP). The recovery service behind the tools issues approval tokens, handles idempotency keys and writes an audit row per call; the planner and checker are pure functions; only the recovery service writes to SQLite.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker><marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9ef0"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ebf0"/></marker></defs><rect width="880" height="832" fill="#0d1117"/><rect x="40" y="16" width="330" height="66" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="41" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Web simulator</text><text x="54" y="62" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Next.js · Alexa+ simulation (unofficial)</text><rect x="470" y="16" width="386" height="66" rx="10" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="4 4"/><text x="486" y="42" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Local dev: 3 processes (:3000, :8766, :8765)</text><text x="486" y="63" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Hosted demo (hdr.hosted): one port for /, /api, /mcp</text><rect x="24" y="112" width="832" height="186" rx="14" fill="#151a21" stroke="#262c35" stroke-width="1"/><text x="840" y="136" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="end">FastAPI · /api</text><text x="840" y="136" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" letter-spacing="0.6" fill="#e8ebf0" text-anchor="end" dx="-121">ORCHESTRATOR</text><rect x="40" y="146" width="210" height="84" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="171" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Session API</text><text x="54" y="192" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">conversation state</text><text x="54" y="211" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">wire trace per turn</text><rect x="318" y="146" width="240" height="84" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="332" y="171" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Agent loop</text><text x="332" y="192" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Strands Agents + Gemini</text><text x="332" y="211" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">rule agent as fallback</text><rect x="626" y="146" width="214" height="84" rx="10" fill="#1b2028" stroke="#4d9ef0" stroke-width="1.5"/><text x="640" y="171" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#4d9ef0" text-anchor="start">Consent check</text><text x="640" y="192" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="start">consent.py</text><text x="640" y="211" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">parent's own words, no if/but</text><path d="M118,82 L118,144" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><path d="M172,146 L172,84" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="104" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">utterance</text><text x="182" y="104" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">speech, card, trace</text><path d="M250,188 L316,188" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="284" y="180" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="middle">turn</text><path d="M520,230 L520,262 L690,262 L690,232" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="605" y="284" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="middle">record_parent_decision</text><path d="M24,330 L426,330 M784,330 L856,330" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="2 5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="324" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#e8ebf0" text-anchor="start">HTTP boundary</text><text x="40" y="350" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">MCP 2025-11-25, Streamable HTTP</text><text x="432" y="318" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">tools/call</text><text x="432" y="337" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">7 tools; approve filtered out</text><text x="432" y="354" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">apply: token + key from a hook</text><text x="778" y="318" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#4d9ef0" text-anchor="end">approve_recovery_plan</text><text x="778" y="337" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">only after a plain yes</text><text x="778" y="354" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">from a parent</text><rect x="24" y="378" width="832" height="412" rx="14" fill="#151a21" stroke="#262c35" stroke-width="1"/><text x="772" y="402" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="end">/mcp · 8 tools</text><text x="772" y="402" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" letter-spacing="0.6" fill="#e8ebf0" text-anchor="end" dx="-121">MCP SERVER</text><path d="M420,230 L420,410" fill="none" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><path d="M790,232 L790,438" fill="none" stroke="#4d9ef0" stroke-width="2" marker-end="url(#arr-accent)" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="404" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">listed to the model</text><rect x="32" y="412" width="482" height="150" rx="10" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="4 4"/><rect x="44" y="424" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="443" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">get_household_state</text><rect x="44" y="458" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="477" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">ingest_school_notice</text><rect x="44" y="492" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="511" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">plan_disruption_recovery</text><rect x="44" y="526" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="545" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">apply_recovery_plan</text><rect x="280" y="424" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="290" y="443" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">verify_recovery</text><rect x="280" y="458" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="290" y="477" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">get_audit_log</text><rect x="280" y="492" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="290" y="511" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">report_availability_change</text><text x="624" y="430" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">orchestrator only</text><rect x="624" y="440" width="216" height="28" rx="6" fill="#173250" stroke="#4d9ef0" stroke-width="1.5"/><text x="634" y="459" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" font-weight="600" fill="#4d9ef0" text-anchor="start">approve_recovery_plan</text><text x="624" y="490" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">issues an HMAC token for one</text><text x="624" y="508" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">plan id and version</text><path d="M273,562 L273,598" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><path d="M732,518 L732,598" fill="none" stroke="#4d9ef0" stroke-width="2" marker-end="url(#arr-accent)" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="600" width="800" height="64" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="625" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Recovery service</text><text x="214" y="625" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="start">service/recovery.py</text><text x="54" y="650" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">approval tokens · idempotency keys · per-action writes · one audit row per call</text><rect x="32" y="700" width="520" height="80" rx="10" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="4 4"/><text x="44" y="720" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">domain/ · pure functions, no I/O</text><rect x="44" y="728" width="238" height="44" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="58" y="753" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Planner</text><text x="136" y="753" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">exhaustive search</text><rect x="302" y="728" width="238" height="44" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="316" y="753" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Checker</text><text x="398" y="753" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">own rules, stored state</text><path d="M262,664 L262,726" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" strok