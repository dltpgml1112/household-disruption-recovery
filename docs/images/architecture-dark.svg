<svg xmlns="http://www.w3.org/2000/svg" width="880" height="964" viewBox="0 0 880 964" role="img" aria-label="System architecture. The web simulator sends each utterance, or a tap on the card, to the orchestrator (FastAPI, /api), which runs the Strands agent with Gemini, a rule agent as fallback, and a consent check. The model gets 7 of the 8 MCP tools; approve_recovery_plan is called only by the orchestrator after the consent check passes, and the server marks it app-only (_meta.ui.visibility app). Every tool call goes over HTTP to the MCP server (/mcp, spec 2025-11-25, Streamable HTTP). The server also serves the card as an MCP App view (MCP Apps 2026-01-26): the HTML resource ui://household-disruption-recovery/card, text/html;profile=mcp-app, linked from plan_disruption_recovery and verify_recovery with _meta.ui.resourceUri. The orchestrator reads it once per session with resources/read and sends it to the simulator, which renders it in a sandboxed iframe as an MCP Apps host; a tap on Apply comes back as ui/message and goes through the consent check like a spoken yes. The recovery service behind the tools issues approval tokens, handles idempotency keys and writes an audit row per call; the planner and checker are pure functions; only the recovery service writes to SQLite."><title>System architecture. The web simulator sends each utterance, or a tap on the card, to the orchestrator (FastAPI, /api), which runs the Strands agent with Gemini, a rule agent as fallback, and a consent check. The model gets 7 of the 8 MCP tools; approve_recovery_plan is called only by the orchestrator after the consent check passes, and the server marks it app-only (_meta.ui.visibility app). Every tool call goes over HTTP to the MCP server (/mcp, spec 2025-11-25, Streamable HTTP). The server also serves the card as an MCP App view (MCP Apps 2026-01-26): the HTML resource ui://household-disruption-recovery/card, text/html;profile=mcp-app, linked from plan_disruption_recovery and verify_recovery with _meta.ui.resourceUri. The orchestrator reads it once per session with resources/read and sends it to the simulator, which renders it in a sandboxed iframe as an MCP Apps host; a tap on Apply comes back as ui/message and goes through the consent check like a spoken yes. The recovery service behind the tools issues approval tokens, handles idempotency keys and writes an audit row per call; the planner and checker are pure functions; only the recovery service writes to SQLite.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker><marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9ef0"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ebf0"/></marker></defs><rect width="880" height="964" fill="#0d1117"/><rect x="40" y="16" width="330" height="84" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="41" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Web simulator</text><text x="54" y="62" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Next.js · Alexa+ simulation (unofficial)</text><text x="54" y="81" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">MCP App host: card in a sandboxed iframe</text><rect x="470" y="16" width="386" height="84" rx="10" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="4 4"/><text x="486" y="51" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Local dev: 3 processes (:3000, :8766, :8765)</text><text x="486" y="72" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Hosted demo (hdr.hosted): one port for /, /api, /mcp</text><rect x="24" y="148" width="832" height="186" rx="14" fill="#151a21" stroke="#262c35" stroke-width="1"/><text x="840" y="172" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="end">FastAPI · /api</text><text x="840" y="172" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" letter-spacing="0.6" fill="#e8ebf0" text-anchor="end" dx="-121">ORCHESTRATOR</text><rect x="40" y="182" width="210" height="84" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="207" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Session API</text><text x="54" y="228" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">conversation state</text><text x="54" y="247" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">wire trace per turn</text><rect x="318" y="182" width="240" height="84" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="332" y="207" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Agent loop</text><text x="332" y="228" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">Strands Agents + Gemini</text><text x="332" y="247" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">rule agent as fallback</text><rect x="626" y="182" width="214" height="84" rx="10" fill="#1b2028" stroke="#4d9ef0" stroke-width="1.5"/><text x="640" y="207" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#4d9ef0" text-anchor="start">Consent check</text><text x="640" y="228" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="start">consent.py</text><text x="640" y="247" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">parent's own words, no if/but</text><path d="M128,100 L128,180" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><path d="M182,182 L182,102" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="124" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">utterance,</text><text x="118" y="142" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">or a card tap</text><text x="118" y="160" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="end">ui/message</text><text x="192" y="124" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">speech, card, trace</text><text x="192" y="142" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">+ card view (MCP App HTML)</text><path d="M250,224 L316,224" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="284" y="216" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="middle">turn</text><path d="M520,266 L520,298 L690,298 L690,268" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="605" y="320" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="middle">record_parent_decision</text><path d="M24,366 L282,366 M806,366 L856,366" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="2 5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="360" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#e8ebf0" text-anchor="start">HTTP boundary</text><text x="40" y="386" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">MCP 2025-11-25, Streamable HTTP</text><text x="302" y="354" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">resources/read</text><text x="302" y="373" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">once per session</text><text x="432" y="354" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">tools/call</text><text x="432" y="373" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">7 tools; approve filtered out</text><text x="432" y="390" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">apply: token + key from a hook</text><text x="800" y="354" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#4d9ef0" text-anchor="end">approve_recovery_plan</text><text x="800" y="373" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">only after a plain yes</text><text x="800" y="390" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">from a parent</text><rect x="24" y="414" width="832" height="508" rx="14" fill="#151a21" stroke="#262c35" stroke-width="1"/><text x="794" y="438" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="end">/mcp · 8 tools</text><text x="794" y="438" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" letter-spacing="0.6" fill="#e8ebf0" text-anchor="end" dx="-121">MCP SERVER</text><text x="40" y="440" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">UI resource · MCP Apps 2026-01-26</text><rect x="44" y="448" width="346" height="66" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="467" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">ui://household-disruption-recovery/card</text><text x="54" y="485" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13"><tspan font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' fill="#9aa3b2">MCP App view · </tspan><tspan font-family='ui-monospace, SFMono-Regular, Consolas, monospace' fill="#9aa3b2">text/html;profile=mcp-app</tspan></text><text x="54" y="503" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13"><tspan font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' fill="#9aa3b2">plan and verify link it: </tspan><tspan font-family='ui-monospace, SFMono-Regular, Consolas, monospace' fill="#9aa3b2">_meta.ui.resourceUri</tspan></text><path d="M250,252 L290,252 L290,446" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,266 L420,542" fill="none" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><path d="M812,268 L812,570" fill="none" stroke="#4d9ef0" stroke-width="2" marker-end="url(#arr-accent)" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="536" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">listed to the model</text><rect x="32" y="544" width="482" height="150" rx="10" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="4 4"/><rect x="44" y="556" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="575" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">get_household_state</text><rect x="44" y="590" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="609" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">ingest_school_notice</text><rect x="44" y="624" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="643" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">plan_disruption_recovery</text><rect x="44" y="658" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="677" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">apply_recovery_plan</text><rect x="280" y="556" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="290" y="575" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">verify_recovery</text><rect x="280" y="590" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="290" y="609" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">get_audit_log</text><rect x="280" y="624" width="224" height="28" rx="6" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="290" y="643" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#e8ebf0" text-anchor="start">report_availability_change</text><text x="624" y="562" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">orchestrator only</text><rect x="730.5" y="549.5" width="62" height="17" rx="4" fill="none" stroke="#4d9ef0" stroke-width="1"/><text x="761.5" y="562" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#4d9ef0" text-anchor="middle">app-only</text><rect x="624" y="572" width="216" height="28" rx="6" fill="#173250" stroke="#4d9ef0" stroke-width="1.5"/><text x="634" y="591" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" font-weight="600" fill="#4d9ef0" text-anchor="start">approve_recovery_plan</text><text x="624" y="622" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">issues an HMAC token for one</text><text x="624" y="640" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">plan id and version</text><path d="M273,694 L273,730" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><path d="M732,650 L732,730" fill="none" stroke="#4d9ef0" stroke-width="2" marker-end="url(#arr-accent)" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="732" width="800" height="64" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="54" y="757" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Recovery service</text><text x="214" y="757" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="13" fill="#9aa3b2" text-anchor="start">service/recovery.py</text><text x="54" y="782" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">approval tokens · idempotency keys · per-action writes · one audit row per call</text><rect x="32" y="832" width="520" height="80" rx="10" fill="none" stroke="#3a414c" stroke-width="1" stroke-dasharray="4 4"/><text x="44" y="852" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">domain/ · pure functions, no I/O</text><rect x="44" y="860" width="238" height="44" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="58" y="885" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Planner</text><text x="136" y="885" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">exhaustive search</text><rect x="302" y="860" width="238" height="44" rx="10" fill="#1b2028" stroke="#3a414c" stroke-width="1"/><text x="316" y="885" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="start">Checker</text><text x="398" y="885" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">own rules, stored state</text><path d="M262,796 L262,858" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="272" y="822" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">snapshot → plan</text><path d="M421,796 L421,858" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="431" y="822" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="start">read-back → violations</text><path d="M620.0,846 L620.0,900 A100.0,8 0 0 0 820.0,900 L820.0,846" fill="#1b2028" stroke="#e8ebf0" stroke-width="1.5"/><ellipse cx="720" cy="846" rx="100.0" ry="8" fill="#222832" stroke="#e8ebf0" stroke-width="1.5"/><text x="720" y="880" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#e8ebf0" text-anchor="middle">SQLite</text><text x="720" y="899" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="middle">written only by the service</text><path d="M660,796 L660,832" fill="none" stroke="#e8ebf0" stroke-width="2.2" marker-end="url(#arr-ink)" stroke-linecap="round" stroke-linejoin="round"/><text x="670" y="820" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#e8ebf0" text-anchor="start">writes</text><path d="M790,832 L790,798" fill="none" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/><text x="780" y="820" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="end">reads</text><text x="440.0" y="948" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9aa3b2" text-anchor="middle">Blue: the approval path. The model never calls approve_recovery_plan; the orchestrator does.</text></svg>
