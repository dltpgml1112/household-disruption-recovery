<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household Disruption Recovery card</title>
<style>
  /* An Alexa+ add-on card, drawn to the Alexa+ MCP add-on visual foundations (developer.amazon.com, 2026-07-21):
     card #FFFFFF (light) / #14181E (dark), type 24 / 18 / 16 / 14 / 12, spacing 2-24, radius 12-16, the primary
     colour only on the final action, no gradients, light and dark from the host. One title, one or two fields,
     one action. System fonts only: this view runs in a sandboxed frame with no network. Each person's name is
     marked in their colour (same tokens as the simulator). It animates only its own arrival, once, and not at all
     under reduced motion. On a phone host (hostContext.platform "mobile") the buttons take the full width. */
  :root {
    --card: #ffffff; --inner: #faf9fb; --ink: #1c1b19; --muted: #5f5d58; --rule: #ece9f0; --line: #c9c6cf;
    --primary: #1f4f99; --primary-ink: #ffffff; --secondary: transparent; --secondary-ink: #1c1b19; --secondary-line: #c9c6cf;
    --focus: #1f5fd1;
    --ok: #1d7448; --ok-soft: #dcefe3; --bad: #b52f00; --bad-soft: #fde4d9; --warn: #855000; --warn-soft: #f7e9cc;
    --sarah-soft: #f9dde6; --mike-soft: #dce7f9; --linda-soft: #e7def8; --emma-soft: #f8e6bd; --noah-soft: #d2eee8;
    --f-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --tone: var(--muted);
  }
  :root[data-theme="dark"] {
    --card: #14181e; --inner: #1b2028; --ink: #eef1f5; --muted: #a5adb9; --rule: #252b35; --line: #3a4250;
    --primary: #2d415e; --primary-ink: #ffffff; --secondary: transparent; --secondary-ink: #eef1f5; --secondary-line: #3a4250;
    --focus: #8fb3ff;
    --ok: #6fcf9a; --ok-soft: #15301f; --bad: #ff8b5e; --bad-soft: #3b1b10; --warn: #f0be66; --warn-soft: #3a2c12;
    --sarah-soft: #4d2534; --mike-soft: #1f3354; --linda-soft: #36294f; --emma-soft: #4a3a12; --noah-soft: #193f3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--card); color: var(--ink); }
  body { font: 16px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
  .card { position: relative; padding: 16px 20px 16px; }
  .card.ok { --tone: var(--ok); } .card.bad { --tone: var(--bad); } .card.none { --tone: var(--warn); }
  .kicker { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--muted); }
  .kicker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex: none; }
  h1 { margin: 6px 0 8px; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .field { margin: 0; padding: 6px 0; font-size: 16px; border-top: 1px solid var(--rule); }
  h1 + .field { border-top: 0; padding-top: 0; }
  .name { color: inherit; padding: 0 1px; }
  .p-sarah { --ps: var(--sarah-soft); } .p-mike { --ps: var(--mike-soft); } .p-linda { --ps: var(--linda-soft); }
  .p-emma { --ps: var(--emma-soft); } .p-noah { --ps: var(--noah-soft); }
  .name { background: linear-gradient(transparent 60%, var(--ps, transparent) 60%); }
  .ok h1, .bad h1, .none h1 { color: var(--tone); }
  .badge { display: inline-grid; place-items: center; width: 30px; height: 30px; margin-right: 10px; border-radius: 50%;
           background: var(--ok); color: var(--card); font-size: 17px; font-weight: 800; line-height: 1; vertical-align: 3px; }
  .pips { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-left: 10px; vertical-align: 1px; }
  .pips i { width: 8px; height: 8px; border-radius: 2px; background: var(--ok); }
  .pips i.miss { background: transparent; box-shadow: inset 0 0 0 2px var(--bad); }
  .choices { margin: 12px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--inner); box-shadow: inset 3px 0 0 var(--warn); }
  .choices h2 { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); }
  .choices ul { margin: 0; padding-left: 20px; }
  .choices li { margin: 2px 0; font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; }
  button { font: inherit; font-size: 16px; font-weight: 700; min-height: 44px; padding: 0 20px; border-radius: 12px; cursor: pointer;
           transition: filter 150ms ease, background-color 150ms ease, transform 150ms ease; }
  button.primary { border: 0; background: var(--primary); color: var(--primary-ink); }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); }
  button.secondary { border: 1px solid var(--secondary-line); background: var(--secondary); color: var(--secondary-ink); }
  /* dark: the Alexa+ primary (#2D415E) sits close to the card, so the final action also gets a light edge */
  :root[data-theme="dark"] button.primary { box-shadow: inset 0 0 0 1.5px #8fb3ff; }
  /* a plan a parent set aside: still readable, clearly not the live question any more */
  .card.aside h1, .card.aside .field { opacity: 0.55; }
  button.secondary:hover:not(:disabled) { filter: brightness(0.96); }
  :root[data-theme="dark"] button.secondary:hover:not(:disabled) { filter: brightness(1.15); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .note { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .actions .note { flex: 1 1 120px; }
  /* a narrow card (a column of a wall display, below the 768 px canvas): one step down the type scale */
  @media (max-width: 380px) {
    .card { padding: 14px 16px; }
    h1 { font-size: 20px; margin: 4px 0 6px; }
    .field { font-size: 15px; padding: 5px 0; }
    button { min-height: 40px; font-size: 15px; padding: 0 16px; }
    .note { font-size: 13px; }
  }
  :root[data-platform="mobile"] .card { padding: 14px 16px; }
  :root[data-platform="mobile"] h1 { font-size: 20px; }
  :root[data-platform="mobile"] .field { font-size: 15px; }
  :root[data-platform="mobile"] .actions button { flex: 1 1 100%; }
  :root[data-platform="mobile"] .actions .note { flex-basis: 100%; text-align: center; }
  @media (prefers-reduced-motion: no-preference) {
    .badge { animation: stamp 460ms cubic-bezier(0.3, 1.5, 0.5, 1) 380ms backwards; }
    .pips i { animation: pip 260ms ease calc(420ms + var(--k, 0) * 30ms) backwards; }
  }
  @keyframes stamp { from { opacity: 0; transform: scale(1.6); } }
  @keyframes pip { from { opacity: 0; transform: scale(0.3); } }
</style>
</head>
<body>
<main id="root" class="card" aria-live="polite"></main>
<script>
// MCP Apps view (io.modelcontextprotocol/ui, spec 2026-01-26). It draws the plan or result
// card from the tool result the host forwards, and turns a tap into the parent's words via
// ui/message. It never calls a tool itself: the host decides who is speaking.
(function () {
  "use strict";
  var PROTOCOL = "2026-01-26";
  var root = document.getElementById("root");
  var nextId = 1;
  var pending = {};

  function post(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    var id = nextId++;
    post({ jsonrpc: "2.0", id: id, method: method, params: params });
    return new Promise(function (resolve, reject) { pending[id] = { resolve: resolve, reject: reject }; });
  }
  function notify(method, params) {
    var msg = { jsonrpc: "2.0", method: method };
    if (params) msg.params = params;
    post(msg);
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  // "08:30-10:00" -> "8:30–10:00"; "08:30-17:00" -> "8:30 AM–5:00 PM"
  function clock(hh, mm) { var h = Number(hh) % 12 || 12; return h + ":" + mm; }
  function times(text) {
    return String(text).replace(/\b(\d\d):(\d\d)-(\d\d):(\d\d)\b/g, function (_, h1, m1, h2, m2) {
      if (Number(h1) < 12 && Number(h2) < 12) return clock(h1, m1) + "–" + clock(h2, m2);
      var s1 = Number(h1) < 12 ? " AM" : " PM", s2 = Number(h2) < 12 ? " AM" : " PM";
      return clock(h1, m1) + s1 + "–" + clock(h2, m2) + s2;
    });
  }
  function applyContext(ctx) {
    if (ctx && (ctx.theme === "dark" || ctx.theme === "light")) document.documentElement.dataset.theme = ctx.theme;
    if (ctx && (ctx.platform === "web" || ctx.platform === "desktop" || ctx.platform === "mobile")) document.documentElement.dataset.platform = ctx.platform;
  }

  function say(text, buttons, note) {
    buttons.forEach(function (b) { b.disabled = true; });
    request("ui/message", { role: "user", content: { type: "text", text: text } })
      .then(function () { note.textContent = "Sent: “" + text + "”"; })
      .catch(function () {
        note.textContent = "The host did not take the answer. Say it instead.";
        buttons.forEach(function (b) { b.disabled = false; });
      });
  }

  function addActions(container, items, noteText) {
    var row = el("div", "actions");
    var note = el("p", "note", noteText || "");
    var buttons = items.map(function (item) {
      var b = el("button", item.primary ? "primary" : "secondary", item.label);
      b.type = "button";
      row.appendChild(b);
      return b;
    });
    items.forEach(function (item, i) {
      buttons[i].addEventListener("click", function () { say(item.says, buttons, note); });
    });
    row.appendChild(note);
    container.appendChild(row);
  }

  // Household members named in the result (ids from the plan's assignments and supervision).
  // A name in the card text is underlined in that person's colour; the words stay as they are.
  function people(sc) {
    var ids = {};
    function add(id) { if (typeof id === "string" && /^[a-z][a-z0-9_-]*$/.test(id)) ids[id] = true; }
    (sc.assignments || []).forEach(function (a) { add(a.member_id); add(a.child_id); });
    (sc.supervision || []).forEach(function (s) { add(s.member_id); add(s.child_id); });
    return ids;
  }
  function withNames(node, text, ids) {
    String(text).split(/\b([A-Z][a-z]+)\b/).forEach(function (part, i) {
      if (i % 2 && ids[part.toLowerCase()]) node.appendChild(el("span", "name p-" + part.toLowerCase(), part));
      else if (part) node.appendChild(document.createTextNode(part));
    });
    return node;
  }
  // one dot per write read back; a hollow red dot for each one that did not go through
  function addPips(node, done, total) {
    done = Number(done); total = Number(total);
    if (!(total > 0 && total <= 40 && done >= 0 && done <= total)) return;
    var pips = el("span", "pips");
    pips.setAttribute("aria-hidden", "true");
    for (var i = 0; i < total; i++) {
      var pip = el("i", i < done ? null : "miss");
      pip.style.setProperty("--k", String(i));
      pips.appendChild(pip);
    }
    node.appendChild(pips);
  }

  function render(result) {
    var sc = (result && result.structuredContent) || {};
    var card = sc.card;
    root.replaceChildren();
    root.className = "card";
    if (!card) {
      var text = (result && result.content && result.content[0] && result.content[0].text) || "";
      root.appendChild(el("p", "note", text ? "No card in this result." : "Waiting for a result."));
      return;
    }
    var isVerify = Object.prototype.hasOwnProperty.call(sc, "ready");
    var kicker = isVerify ? "Result · read back from storage"
      : sc.feasible && sc.status === "rejected" ? "Set aside · plan v" + sc.version
      : sc.feasible ? "Proposed fix · plan v" + sc.version
      : "No plan · plan v" + sc.version;
    root.appendChild(el("p", "kicker", kicker));
    var h1 = el("h1");
    if (isVerify && sc.ready) {
      root.classList.add("ok");
      h1.appendChild(el("span", "badge", "✓"));
    } else if (isVerify) {
      root.classList.add("bad");
    } else if (!sc.feasible) {
      root.classList.add("none");
    }
    var ids = people(sc);
    withNames(h1, card.title, ids);
    root.appendChild(h1);
    (card.fields || []).forEach(function (f) {
      var p = withNames(el("p", "field"), f, ids);
      if (isVerify && /^\d+\/\d+ changes read back$/.test(f)) addPips(p, sc.writes_verified, sc.writes_total);
      root.appendChild(p);
    });

    if (!isVerify && sc.feasible) {
      if (sc.status === "proposed") {
        addActions(root, [
          { label: card.action || "Apply changes", says: "Yes, do it", primary: true },
          { label: "Not now", says: "No, not now" }
        ], "Nothing changes until a parent approves.");
      } else {
        if (sc.status === "rejected") root.classList.add("none", "aside");
        root.appendChild(el("p", "note", sc.status === "rejected"
          ? "Set aside by a parent. Nothing was written."
          : "Plan " + sc.status + "."));
      }
    } else if (!isVerify) {
      var options = (sc.options || []).slice(0, 3);
      if (options.length) {
        var box = el("div", "choices");
        box.appendChild(el("h2", null, "A parent needs to choose"));
        var list = el("ul");
        options.forEach(function (o) { list.appendChild(el("li", null, times(o))); });
        box.appendChild(list);
        root.appendChild(box);
      }
    } else if (!sc.ready && card.action) {
      addActions(root, [{ label: card.action, says: card.action, primary: true }], "");
    }
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    var m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && (m.result !== undefined || m.error !== undefined) && pending[m.id]) {
      var p = pending[m.id];
      delete pending[m.id];
      if (m.error) p.reject(m.error); else p.resolve(m.result);
      return;
    }
    // report the new size at once as well: a frame the browser is not painting yet gets no ResizeObserver callback
    if (m.method === "ui/notifications/tool-result") { render(m.params || {}); reportSize(); }
    else if (m.method === "ui/notifications/host-context-changed") applyContext(m.params || {});
    else if (m.method === "ui/resource-teardown" && m.id !== undefined) post({ jsonrpc: "2.0", id: m.id, result: {} });
  });

  // the card's own size, not the frame's: scrollHeight never drops below the frame height
  function reportSize() {
    var box = root.getBoundingClientRect();
    notify("ui/notifications/size-changed", { width: Math.ceil(box.width), height: Math.ceil(box.height) });
  }
  if (window.ResizeObserver) new ResizeObserver(reportSize).observe(root);

  root.appendChild(el("p", "note", "Waiting for the host."));
  // A host that was not listening yet never answers the first request, so ask again a few times;
  // only the first answer counts (one ui/notifications/initialized).
  var started = false, tries = 0;
  function start() {
    tries += 1;
    request("ui/initialize", {
      appInfo: { name: "household-disruption-recovery-card", version: "1.0.0" },
      appCapabilities: {},
      protocolVersion: PROTOCOL
    }).then(function (res) {
      if (started) return;
      started = true;
      applyContext((res && res.hostContext) || {});
      notify("ui/notifications/initialized");
    }).catch(function () {
      if (started) return;
      started = true;
      root.replaceChildren(el("p", "note", "This card needs a host that supports MCP Apps."));
    });
    if (tries < 6) setTimeout(function () { if (!started) start(); }, 800);
  }
  start();
})();
</script>
</body>
</html>
