name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Test (no model API key; the LLM agent tests use a scripted model)
        run: uv run pytest -o addopts="" -q

  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/simulator/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Static build (what the hosted demo serves)
        run: npm run build
        env:
          HDR_STATIC_EXPORT: "1"
          NEXT_PUBLIC_HDR_API: same-origin
          NEXT_TELEMETRY_DISABLED: "1"
